<!-- 主要功能：提供小學堂場景的裝飾背景。
viewBox 定義圖形座標與比例，path／shape 的填色決定圖層；顯示尺寸與動畫由引用它的 CSS／JavaScript 控制。
這是網站直接使用的靜態 SVG，可修改圖形，無需產生工具；純裝飾不承擔按鈕或文字資訊功能。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 350" preserveAspectRatio="none">
 <defs><path id="cloud" d="M0 30C-18 30-20 7-3 3 0-20 32-25 42-5 66-11 82 30 55 30Z"/></defs>
 <g fill="#fff">
  <use href="#cloud" transform="translate(110 70) scale(1.9 1.6)" opacity=".85"/>
  <use href="#cloud" transform="translate(410 48) scale(.65 .6)" opacity=".65"/>
  <use href="#cloud" transform="translate(680 90) scale(1.2 1)" opacity=".8"/>
  <use href="#cloud" transform="translate(1040 38) scale(1.65 1.3)" opacity=".85"/>
  <use href="#cloud" transform="translate(1430 122) scale(1.35 1.1)" opacity=".8"/>
  <use href="#cloud" transform="translate(1270 210) scale(.65 .55)" opacity=".6"/>
  <use href="#cloud" transform="translate(920 173) scale(.5 .48)" opacity=".6"/>
  <use href="#cloud" transform="translate(40 213) scale(.8 .7)" opacity=".7"/>
  <use href="#cloud" transform="translate(330 160) scale(1 .85)" opacity=".7"/>
  <use href="#cloud" transform="translate(10 337) scale(3 1.4)" opacity=".45"/>
  <use href="#cloud" transform="translate(1400 336) scale(2.7 1.2)" opacity=".45"/>
 </g>
</svg>
