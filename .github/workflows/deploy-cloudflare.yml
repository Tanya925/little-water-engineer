# 只在 main 更新或手動觸發時部署正式網站。先安裝鎖定的前後端相依套件並通過
# npm run check，再用 Wrangler 上傳前端靜態檔與 Worker；部署憑證只取自 GitHub Secret。
name: Deploy website to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run check
      - run: npx wrangler deploy --config backend/wrangler.site.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
